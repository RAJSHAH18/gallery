<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#331a54">
<title>Our Beautiful Memories</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
    --pink:#ff69b4;
    --light-pink:#ffc0cb;
    --glass:rgba(255,255,255,.12);
}
html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    overflow:hidden;
}
body{
    min-height:100vh;
    min-height:100dvh;
    background:linear-gradient(145deg,#24103e 0%,#4b205f 48%,#8b367b 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    color:white;
    overscroll-behavior:none;
}
button{font:inherit}
.nav-button{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    width:50px;
    height:50px;
    background:rgba(255,105,180,.2);
    border:1px solid rgba(255,220,240,.65);
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    z-index:1000;
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 5px 22px rgba(255,20,147,.25),inset 0 1px 1px rgba(255,255,255,.25);
    transition:background .25s,box-shadow .25s,transform .25s;
}
.nav-button:hover{
    background:rgba(255,105,180,.55);
    box-shadow:0 0 25px rgba(255,20,147,.55);
}
.nav-button:active{transform:translateY(-50%) scale(.92)}
.nav-button svg{width:22px;height:22px;pointer-events:none}
.nav-button.prev{left:max(24px,env(safe-area-inset-left))}
.nav-button.next{right:max(24px,env(safe-area-inset-right))}
.spotlight{
    position:fixed;
    top:0;
    left:50%;
    width:400px;
    height:400px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,192,203,.19),transparent 70%);
    pointer-events:none;
    z-index:2;
    animation:spotlightPulse 4s infinite;
}
@keyframes spotlightPulse{
    0%,100%{opacity:.5}
    50%{opacity:.8}
}
.hearts,.stars{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}
.hearts{z-index:3}
.stars{z-index:0}
.heart{
    position:absolute;
    background:rgba(255,105,180,.6);
    transform:rotate(-45deg);
    opacity:0;
    animation:heartFloat 20s linear infinite;
}
.heart::before,.heart::after{
    content:'';
    position:absolute;
    width:100%;
    height:100%;
    background:inherit;
    border-radius:50%;
}
.heart::before{top:-50%;left:0}
.heart::after{top:0;left:50%}
@keyframes heartFloat{
    0%{transform:translate(0,0) rotate(-45deg) scale(0);opacity:0}
    10%{opacity:.8}
    90%{opacity:.2}
    100%{transform:translate(var(--tx),-100vh) rotate(var(--r)) scale(var(--s));opacity:0}
}
.star{
    position:absolute;
    background:white;
    border-radius:50%;
    animation:twinkle 1.5s infinite ease-in-out;
}
@keyframes twinkle{
    0%,100%{opacity:.3;transform:scale(1)}
    50%{opacity:1;transform:scale(1.2)}
}
.ambient-light{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle at 50% 0%,rgba(255,182,193,.2),transparent 50%);
    z-index:1;
}
.title{
    position:fixed;
    top:max(24px,env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:28px;
    font-family:"Brush Script MT","Segoe Script",cursive;
    text-shadow:0 0 18px rgba(255,105,180,.8);
    letter-spacing:1.5px;
    z-index:100;
    opacity:.95;
    background:rgba(255,255,255,.09);
    padding:11px 25px;
    border-radius:40px;
    border:1px solid rgba(255,255,255,.35);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 28px rgba(20,0,35,.12),inset 0 1px rgba(255,255,255,.2);
    white-space:nowrap;
    max-width:calc(100vw - 32px);
}
.bottom-text{
    position:fixed;
    bottom:max(28px,env(safe-area-inset-bottom));
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:16px;
    font-family:"Comic Sans MS","Segoe Script",cursive;
    text-shadow:0 0 12px rgba(255,105,180,.8);
    z-index:100;
    width:calc(100% - 150px);
    max-width:500px;
    text-align:center;
    opacity:.9;
    pointer-events:none;
}
.gallery-container{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:100vw;
    height:100vh;
    height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    perspective:1600px;
    perspective-origin:50% 50%;
    z-index:5;
    touch-action:pan-y;
}
.gallery{
    position:relative;
    width:300px;
    height:400px;
    transform-style:preserve-3d;
    transition:transform .5s ease-out;
    will-change:transform;
}
.card{
    position:absolute;
    width:300px;
    height:400px;
    background:rgba(255,255,255,.1);
    border-radius:22px;
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    border:2px solid rgba(255,105,180,.55);
    transition:all .6s cubic-bezier(.2,.75,.25,1);
    cursor:grab;
    overflow:hidden;
    transform-origin:center center;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
    backface-visibility:visible;
    -webkit-backface-visibility:visible;
}
.card:active{cursor:grabbing}
.card::before{
    content:'';
    position:absolute;
    inset:0;
    background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 45%,rgba(255,105,180,.06));
    z-index:2;
    pointer-events:none;
}
.card::after{
    content:'';
    position:absolute;
    inset:-100%;
    background:radial-gradient(circle,rgba(255,255,255,.4),transparent 50%);
    opacity:0;
    transition:opacity .3s;
    pointer-events:none;
}
.card.active{
    transform:scale(1.12) translateZ(100px);
    box-shadow:0 25px 65px rgba(255,105,180,.38),0 0 28px rgba(255,105,180,.25);
    border:2px solid rgba(255,255,255,.9);
}
.card.active::after{opacity:.2}
.card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scale(1.04);
    transition:transform .5s;
    user-select:none;
    -webkit-user-drag:none;
}
.card:hover img{transform:scale(1.08)}
.number{
    position:absolute;
    bottom:12px;
    right:12px;
    min-width:38px;
    text-align:center;
    background:rgba(40,10,55,.4);
    color:white;
    padding:7px 13px;
    border:1px solid rgba(255,255,255,.5);
    border-radius:30px;
    font-size:13px;
    font-weight:bold;
    z-index:3;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}
.bottom-controls{
    position:fixed;
    bottom:max(20px,env(safe-area-inset-bottom));
    right:max(20px,env(safe-area-inset-right));
    display:flex;
    align-items:center;
    gap:11px;
    z-index:1000;
}
.music-control,.shuffle-control{
    position:relative;
    width:48px;
    height:48px;
    flex:0 0 48px;
    background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,105,180,.2));
    color:white;
    border:1px solid rgba(255,255,255,.45);
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .25s,background .25s,box-shadow .25s;
    box-shadow:0 5px 20px rgba(255,20,147,.22),inset 0 1px rgba(255,255,255,.2);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    outline:none;
}
.music-control svg,.shuffle-control svg{
    width:21px;
    height:21px;
    pointer-events:none;
}
.music-control:hover,.shuffle-control:hover{
    background:linear-gradient(145deg,rgba(255,255,255,.32),rgba(255,105,180,.5));
    box-shadow:0 0 25px rgba(255,20,147,.45);
    transform:translateY(-2px);
}
.music-control:active,.shuffle-control:active{transform:scale(.91)}
.music-control.is-playing{
    background:linear-gradient(145deg,rgba(255,105,180,.55),rgba(173,77,230,.4));
    box-shadow:0 0 24px rgba(255,105,180,.4);
}
.shuffle-control:focus-visible,.music-control:focus-visible,.nav-button:focus-visible{
    outline:2px solid white;
    outline-offset:4px;
}
@media(hover:none){
    .card:hover img{transform:scale(1.04)}
}
@media(max-width:768px){
    .nav-button{
        width:42px;
        height:42px;
    }
    .nav-button.prev{left:max(10px,env(safe-area-inset-left))}
    .nav-button.next{right:max(10px,env(safe-area-inset-right))}
    .nav-button svg{width:19px;height:19px}
    .gallery,.card{
        width:220px;
        height:300px;
    }
    .gallery-container{perspective:1100px}
    .card.active{transform:scale(1.08) translateZ(65px)}
    .title{
        top:max(18px,env(safe-area-inset-top));
        font-size:23px;
        padding:9px 17px;
        letter-spacing:1px;
    }
    .bottom-text{
        bottom:calc(max(20px,env(safe-area-inset-bottom)) + 58px);
        width:calc(100% - 32px);
        max-width:100%;
        font-size:14px;
    }
    .bottom-controls{
        bottom:max(12px,env(safe-area-inset-bottom));
        right:max(14px,env(safe-area-inset-right));
        gap:9px;
    }
    .music-control,.shuffle-control{
        width:44px;
        height:44px;
        flex-basis:44px;
    }
}
@media(max-width:420px){
    .gallery,.card{
        width:190px;
        height:265px;
    }
    .gallery-container{perspective:950px}
    .card.active{transform:scale(1.06) translateZ(48px)}
    .title{
        font-size:21px;
        padding:9px 14px;
    }
    .nav-button{
        width:36px;
        height:36px;
    }
    .nav-button.prev{left:7px}
    .nav-button.next{right:7px}
    .bottom-text{font-size:13px}
}
@media(max-height:560px) and (orientation:landscape){
    .title{
        top:8px;
        font-size:19px;
        padding:6px 14px;
    }
    .gallery,.card{
        width:150px;
        height:200px;
    }
    .gallery-container{perspective:800px}
    .card.active{transform:scale(1.06) translateZ(35px)}
    .bottom-text{
        bottom:10px;
        left:15px;
        transform:none;
        width:auto;
        max-width:45%;
        font-size:12px;
        text-align:left;
    }
    .bottom-controls{
        bottom:8px;
        right:12px;
    }
    .music-control,.shuffle-control{
        width:38px;
        height:38px;
        flex-basis:38px;
    }
}
@media(prefers-reduced-motion:reduce){
    .heart,.star,.spotlight{animation:none}
    .gallery,.card,.card img,.nav-button,.music-control,.shuffle-control{
        transition-duration:.01ms;
    }
}
</style>
</head>

<body>
<div class="title">Our Beautiful Memories</div>
<div class="bottom-text">Every moment with you is pure magic ♥</div>
<div class="ambient-light"></div>
<div class="spotlight"></div>
<div class="stars"></div>
<div class="hearts"></div>

<button class="nav-button prev" aria-label="Previous photos" title="Previous photos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"/>
    </svg>
</button>

<button class="nav-button next" aria-label="Next photos" title="Next photos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 18l6-6-6-6"/>
    </svg>
</button>

<div class="gallery-container">
    <div class="gallery"></div>
</div>

<div class="bottom-controls">
    <button class="shuffle-control" id="shuffle-toggle" title="Next six memories" aria-label="Show next six memories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 3h5v5"/>
            <path d="M4 20L21 3"/>
            <path d="M21 16v5h-5"/>
            <path d="M15 15l6 6"/>
            <path d="M4 4l5 5"/>
        </svg>
    </button>

    <button class="music-control" id="music-toggle" aria-label="Play background music" title="Play music">
        <svg class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>
        </svg>
    </button>
</div>

<audio id="background-music" loop preload="none">
    <source src="my.mp3" type="audio/mpeg">
</audio>

<script>
function createStars(){
    const container=document.querySelector('.stars');
    container.innerHTML='';
    for(let i=0;i<200;i++){
        const star=document.createElement('div');
        star.className='star';
        star.style.width=Math.random()*3+'px';
        star.style.height=star.style.width;
        star.style.left=Math.random()*100+'%';
        star.style.top=Math.random()*100+'%';
        star.style.animationDelay=Math.random()*2+'s';
        container.appendChild(star);
    }
}

function createHearts(){
    const container=document.querySelector('.hearts');
    container.innerHTML='';
    for(let i=0;i<50;i++){
        const heart=document.createElement('div');
        heart.className='heart';
        const size=5+Math.random()*10;
        heart.style.width=size+'px';
        heart.style.height=size+'px';
        heart.style.left=Math.random()*100+'%';
        heart.style.bottom='-10px';
        heart.style.setProperty('--tx',(Math.random()*200-100)+'px');
        heart.style.setProperty('--r',(Math.random()*90-45)+'deg');
        heart.style.setProperty('--s',.5+Math.random()*1.5);
        heart.style.animationDuration=(10+Math.random()*20)+'s';
        heart.style.animationDelay=Math.random()*20+'s';
        container.appendChild(heart);
    }
}

function createGallery(){
    const gallery=document.querySelector('.gallery');
    const totalCards=6;
    const getRadius=()=>window.innerWidth<420?225:window.innerWidth<768?280:600;
    let radius=getRadius();
    let currentAngle=0;
    let isDragging=false;
    let currentX=0;
    let autoRotateInterval=null;
    let dragStarted=false;

    const prevButton=document.querySelector('.nav-button.prev');
    const nextButton=document.querySelector('.nav-button.next');
    const shuffleButton=document.getElementById('shuffle-toggle');
    const musicToggle=document.getElementById('music-toggle');
    const backgroundMusic=document.getElementById('background-music');

    const imageUrls=[
        'pic1.png',
        'pic2.png',
        'pic3.png',
        'pic4.png',
        'pic5.png',
        'pic6.png',
        'pic7.png',
        'pic8.png',
        'pic9.png',
        'pic10.jpg',
        'pic11.jpg',
        'pic12.jpg',
        'pic13.png',
        'pic14.png',
        'pic15.png',
        'pic16.png',
        'pic17.png',
        'pic18.png',
        'pic19.png',
        'pic20.png',
        'pic21.png',
        'pic22.png',
        'pic23.png',
        'pic24.png',
        'pic25.jpg',
        'pic26.png',
        'pic27.png',
        'pic28.png',
        'pic29.png',
        'pic30.png'
    ];

    // Sequential batches: 1–6, 7–12, 13–18, 19–24, 25–30, then 1–6.
    let batchStart=0;
    const cards=[];

    function positionCards(){
        radius=getRadius();
        cards.forEach((card,i)=>{
            const angle=(i/totalCards)*Math.PI*2;
            const x=Math.sin(angle)*radius;
            const z=Math.cos(angle)*radius;
            card.dataset.baseTransform=`translateX(${x}px) translateZ(${z}px)`;
            card.style.transform=card.dataset.baseTransform;
        });
        updateRotation();
    }

    for(let i=0;i<totalCards;i++){
        const card=document.createElement('div');
        card.className='card';
        card.dataset.imageIndex=i;

        const img=document.createElement('img');
        img.src=imageUrls[i];
        img.alt=`Memory ${i+1}`;
        img.draggable=false;
        img.onerror=function(){
            this.alt=`Image not found: ${imageUrls[Number(card.dataset.imageIndex)]}`;
            this.style.background='linear-gradient(45deg,#ff69b4,#ffc0cb)';
        };
        card.appendChild(img);

        const number=document.createElement('div');
        number.className='number';
        number.textContent=i+1;
        card.appendChild(number);

        gallery.appendChild(card);
        cards.push(card);
    }

    function updateBatch(){
        cards.forEach((card,index)=>{
            const imageIndex=batchStart+index;
            const img=card.querySelector('img');
            img.src=imageUrls[imageIndex];
            img.alt=`Memory ${imageIndex+1}`;
            img.style.background='';
            card.dataset.imageIndex=imageIndex;
            card.querySelector('.number').textContent=imageIndex+1;
        });
    }

    shuffleButton.addEventListener('click',()=>{
        batchStart=(batchStart+totalCards)%imageUrls.length;
        updateBatch();

        shuffleButton.animate(
            [
                {transform:'rotate(0deg) scale(1)'},
                {transform:'rotate(100deg) scale(1.12)'},
                {transform:'rotate(180deg) scale(1)'}
            ],
            {duration:350,easing:'ease-out'}
        );
    });

    function updateRotation(){
        gallery.style.transform=`rotateY(${currentAngle}deg)`;

        const activeIndex=(
            Math.round((-currentAngle/360)*totalCards)%totalCards
            +totalCards
        )%totalCards;

        cards.forEach((card,index)=>{
            card.classList.toggle('active',index===activeIndex);
        });
    }

    function startAutoRotate(){
        clearInterval(autoRotateInterval);
        if(isDragging)return;

        autoRotateInterval=setInterval(()=>{
            currentAngle-=.2;
            updateRotation();
        },30);
    }

    prevButton.addEventListener('click',()=>{
        currentAngle+=360/totalCards;
        updateRotation();
        startAutoRotate();
    });

    nextButton.addEventListener('click',()=>{
        currentAngle-=360/totalCards;
        updateRotation();
        startAutoRotate();
    });

    function isControl(target){
        return Boolean(target.closest('button,.bottom-controls'));
    }

    document.addEventListener('mousedown',e=>{
        if(isControl(e.target))return;
        isDragging=true;
        dragStarted=false;
        currentX=e.clientX;
        clearInterval(autoRotateInterval);
        document.body.style.cursor='grabbing';
    });

    document.addEventListener('touchstart',e=>{
        if(isControl(e.target))return;
        isDragging=true;
        dragStarted=false;
        currentX=e.touches[0].clientX;
        clearInterval(autoRotateInterval);
    },{passive:true});

    document.addEventListener('mousemove',e=>{
        if(isDragging){
            const delta=e.clientX-currentX;
            if(Math.abs(delta)>1)dragStarted=true;
            currentAngle+=delta*(window.innerWidth<768?.65:.5);
            currentX=e.clientX;
            updateRotation();
        }

        const spotlight=document.querySelector('.spotlight');
        if(window.matchMedia('(hover: hover)').matches){
            spotlight.style.left=e.clientX+'px';
            spotlight.style.top=e.clientY+'px';
        }
    });

    document.addEventListener('touchmove',e=>{
        if(!isDragging)return;
        const delta=e.touches[0].clientX-currentX;
        if(Math.abs(delta)>1)dragStarted=true;
        currentAngle+=delta*.65;
        currentX=e.touches[0].clientX;
        updateRotation();
    },{passive:true});

    function stopDragging(){
        if(!isDragging)return;
        isDragging=false;
        document.body.style.cursor='default';
        startAutoRotate();
    }

    document.addEventListener('mouseup',stopDragging);
    document.addEventListener('touchend',stopDragging);
    document.addEventListener('touchcancel',stopDragging);

    let isMusicPlaying=false;

    musicToggle.addEventListener('click',async()=>{
        if(isMusicPlaying){
            backgroundMusic.pause();
            musicToggle.classList.remove('is-playing');
            musicToggle.setAttribute('aria-label','Play background music');
            musicToggle.title='Play music';
            musicToggle.innerHTML=`
                <svg class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 18V5l12-2v13"/>
                    <circle cx="6" cy="18" r="3"/>
                    <circle cx="18" cy="16" r="3"/>
                </svg>`;
            isMusicPlaying=false;
        }else{
            try{
                await backgroundMusic.play();
                musicToggle.classList.add('is-playing');
                musicToggle.setAttribute('aria-label','Pause background music');
                musicToggle.title='Pause music';
                musicToggle.innerHTML=`
                    <svg class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="6" y="4" width="4" height="16" rx="1"/>
                        <rect x="14" y="4" width="4" height="16" rx="1"/>
                    </svg>`;
                isMusicPlaying=true;
            }catch(error){
                console.error('Music could not play:',error);
            }
        }
    });

    // Keep the button state correct if playback is interrupted elsewhere.
    backgroundMusic.addEventListener('pause',()=>{
        isMusicPlaying=false;
        musicToggle.classList.remove('is-playing');
    });

    backgroundMusic.addEventListener('play',()=>{
        isMusicPlaying=true;
        musicToggle.classList.add('is-playing');
    });

    positionCards();
    startAutoRotate();

    let resizeTimer=null;
    window.addEventListener('resize',()=>{
        clearTimeout(resizeTimer);
        resizeTimer=setTimeout(positionCards,100);
    });
}

window.addEventListener('DOMContentLoaded',()=>{
    createStars();
    createHearts();
    createGallery();
});
</script>
</body>
</html>
